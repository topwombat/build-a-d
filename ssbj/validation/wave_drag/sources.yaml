  - item: Harris TM X-947 - method of separating experimental wave drag; configurations correlated
    values: "Fig. 6 scatter: SCAT 15 (M 2.3, 2.6, 3.0), SCAT 15-A (2.3, 3.0), SCAT 15-B (1.6, 2.2 - legend partly garbled), SCAT 16 (2.4, 2.6, 3.0), SCAT 16-A (2.4, 2.6, 3.0), SCAT 4 (2.3, 2.6, 3.0, 3.5), FIGHTER (1.4, 2.2); experimental vs computed CD,wave 0-0.010"
    unit: dimensionless
    conditions: transition fixed near leading edges; zero lift
    source:
      title: "An Analysis and Correlation of Aircraft Wave Drag"
      authors: "Roy V. Harris, Jr., Langley Research Center"
      report_number: "NASA TM X-947 (March 1964)"
      url: "https://www.pdas.com/refs/tmx947.pdf"
      page_figure_table: "p. 5-8 [pdf 9-12], fig. 3, 5, 6"
    quote_or_transcription: "\"The experimental wave-drag coefficients were determined for each configuration by subtracting the equivalent flat-plate turbulent skin-friction drag and an estimated camber drag from the measured total drag at zero lift.\" (p. 6). Semispan wings: \"The wave-drag coefficients were determined by subtracting the equivalent flat-plate turbulent skin-friction drag coefficients from the measured total-drag coefficients.\" (p. 5)"
    source_quality: pdf_read
    retrieved: 2026-10-06
    notes: >
      No geometry tables in TM X-947 (sketches only); airplane data only as a computed-vs-measured
      scatter (fig. 6) with no point labels by Mach number. Geometry/tests are in refs 11-16:
      TM X-815, TM X-803, TM X-817 (SCAT 16 blended wing-body), TM X-800 (arrow-wing transport),
      TM X-759 (fighter), TM X-905. Semispan wings 1-4 from TN D-631 and TM X-332 (all circular-arc
      sections; wing-alone, M ~1.4-2.2) - simple fully-defined geometry if a wing-alone check is wanted.
      Not usable on its own as a validation case.

  - item: TP 1358 SCAT 15-F-9898 model friction and computed wave drag at M 2.70
    values: {model_CD_f: 0.00765, model_CD_w_computed: 0.00110, airplane_CD_f: 0.00379, airplane_CD_w: 0.00122, grit_drag_increment: -0.00040}
    unit: dimensionless
    conditions: "SCAT 15-F-9898 wind-tunnel model (0.015 scale) at design M = 2.70; values are COMPUTED (T' friction method; far-field area-rule wave drag)"
    source:
      title: "Theoretical Evaluation of High-Speed Aerodynamics for Arrow-Wing Configurations"
      authors: "Samuel M. Dollyhigh, Langley Research Center"
      report_number: "NASA TP-1358 (Jan. 1979)"
      url: "https://archive.org/download/nasa-reports_nas-1601358/nasa-reports_nas-1601358.pdf"
      page_figure_table: "Table I p. 23 [pdf 25]"
    quote_or_transcription: "TABLE I.- EXTRAPOLATION OF SCAT 15-F-9898 MODEL DATA TO FULL SCALE: Skin friction (model CD,f = 0.00765; airplane Cd,f = 0.00379) -0.00386; Roughness drag 0.00023; Wave drag (model CD,w = 0.00110; airplane Cd,w = 0.00122) 0.00012; Grit drag -0.00040; Total -0.00391"
    source_quality: pdf_read
    retrieved: 2026-10-06
    notes: >
      SCAT 15-F (74 deg warped arrow wing, 4 nacelles) is the most SST-representative case, with
      wind-tunnel data at M 2.30 and 2.70 tabulated in TP-1358's appendix (from NASA TM-78706,
