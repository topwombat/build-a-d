# Wave-drag (far-field area-rule / Harris-type) validation sources
# retrieved: 2026-10-06 for every entry.
# Access note: ntrs.nasa.gov (citations API and downloads) returned HTTP 403 (nginx) from this
# sandbox even with a browser User-Agent. NTRS PDFs were obtained from the archive.org mirror
# "NASA_NTRS_Archive_<NTRS id>" / "nasa-reports_*" items; TM X-947 from pdas.com.
# Page numbers: printed page number, with the PDF page index in brackets [pdf N].
# source_quality: pdf_read = I read the PDF (text layer and/or rendered page images).
# Values marked "digitized" were read by me from rendered figure images (method in notes);
# values marked "visual" were read by eye from a rendered figure.

sources:

  # ---------------------------------------------------------------------------------
  # PRIMARY CASE: NASA TM X-372 arrow model (geometry fully tabulated, wave drag exp+theory)
  # ---------------------------------------------------------------------------------
