    values: {S_ref_in2: 800, A: 2, semispan_in: 20, body_length_in: 60, c_root_in: 40, mac_in: 26.67, LE_sweep_deg: 70.82, TE_sweep_deg: 41.19, moment_ref_station_in: 34.50}
    unit: inch / deg
    conditions: wind-tunnel model (Ames Unitary Plan)
    source:
      title: "Investigation at Mach Numbers of 0.20 to 3.50 of Blended Wing-Body Combinations of Sonic Design with Diamond, Delta, and Arrow Plan Forms"
      authors: "George H. Holdaway and Jack A. Mellenthin, Ames Research Center"
      report_number: "NASA TM X-372 (Aug. 1960; declassified Sept. 1, 1961); NTRS 19980235518"
      url: "https://archive.org/download/NASA_NTRS_Archive_19980235518/NASA_NTRS_Archive_19980235518.pdf"
      page_figure_table: "fig. 1(d) p. 28 [pdf 30]"
    quote_or_transcription: "A = 2; b/2 = 20; l = 60; cR = 40; Sw = 800 sq in.; c-bar = 26.67; dimensions in inches; 70.82 deg; 41.19 deg; Sta. 0, Sta. 3.15, Sta. 34.50 (Moment center), Sta. 41.53, Sta. 57.50"
    source_quality: pdf_read
    retrieved: 2026-10-06
    notes: "Full geometry transcription in tmx372_arrow_geometry.yaml."

  - item: TM X-372 arrow wing coordinates (Table IV) and body radii (Table I)
    values: "streamwise semithickness at y = 0, 2.000, 4.333, 6.667, 10.000, 13.333, 16.667 in; ridge and blunt-TE lines; body radii x = 3.15..60 in"
    unit: inch
    conditions: symmetric (uncambered) wing, body of revolution
    source:
      title: NASA TM X-372 (as above)
      report_number: NASA TM X-372
      url: "https://archive.org/download/NASA_NTRS_Archive_19980235518/NASA_NTRS_Archive_19980235518.pdf"
      page_figure_table: "Table I p. 18 [pdf 20]; Table IV p. 21-22 [pdf 23-24]; text p. 5 [pdf 8]"
    quote_or_transcription: >
      Table IV transcribed in full into tmx372_arrow_geometry.yaml. Text: "The wing thickness in
      each case is formed by straight-line elements perpendicular to the model center line which
      form triangular spanwise sections as shown in figure 2. Note that the rear portion of the
      arrow wing was designed with a blunt trailing edge ... the trailing-edge thicknesses of the
      arrow wing were half the ridge thicknesses, except near the body juncture" (p. 5).
      Table I footnote 2: "Part of a von Karman ogive (l = 40 in. and rb = 1.625 in.)".
    source_quality: pdf_read
    retrieved: 2026-10-06
    notes: >
      Several body radii in the blended region (x=38-45, 55-57.5) have a faint last digit
      (flagged in the geometry file). Forward body x=3.15-35.23 verified against the analytic
      von Karman ogive to 0.001 in. Table IV y=6.667, x=44.000 is printed 0.371; linear run-out
      implies 0.321 (probable misprint; my inference).

