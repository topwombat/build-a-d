  - item: TN D-3034 flat CA-025 model (model 1) - geometry
    values: {span_in: 20.0, S_ft2: 1.62, mac_in: 13.97, LE_sweep_deg: 76, AR: 1.71, body_length_in: 38.0, wing_apex_station_in: 10.0, overall_length_to_tip_TE_in: 50.0, tip_chord_in: 8.3, section: "2.5-percent-thick streamwise circular arc", body: "Table II three-arc non-circular cross sections R1,R2,R3,H,zb vs x = 0..38 in"}
    unit: inch / ft^2 / deg
    conditions: flat (uncambered, untwisted) wing; body volume equally above/below wing reference plane
    source:
      title: "Effects of Thickness on Supersonic Performance of a Wing-Body Configuration Employing a Warped Highly Swept Arrow Wing"
      authors: "F. Edward McLean and Dennis E. Fuller, Langley Research Center"
      report_number: "NASA TN D-3034 (Oct. 1965); NTRS 19650025463"
      url: "https://archive.org/download/NASA_NTRS_Archive_19650025463/NASA_NTRS_Archive_19650025463.pdf"
      page_figure_table: "symbols p. 2-3; fig. 1(a) p. 14 [pdf 16]; Table II p. 13 [pdf 15]"
    quote_or_transcription: "\"b wing span, 20 inches\"; \"c-bar wing mean aerodynamic chord, 13.97 inches\"; \"S wing planform area, 1.62 sq ft\"; \"The wing planform had 76 deg leading-edge sweep, and aspect ratio of 1.71, and the wing tips were clipped perpendicular to the stream direction\"; fig. 1(a) dimensions 10.0, 29.3, 30.0, 38.0, 50.0, 8.3, 20.0"
    source_quality: pdf_read
    retrieved: 2026-10-06
    notes: >
      Body cross-sections are a three-arc construction (R1, R2, R3, H, zb) - area computable
      but construction needs interpretation; TE sweep not stated (must be derived from fig. 1(a)
      dimensions: tip LE at x=10+10*tan76=50.1 ~ 50.0, tip chord 8.3; the drawing appears to
      place the TE-centreline intersection at the 30.0 dimension, but this is my reading of
      the drawing, not a stated value). Table II not transcribed numerically here (image at PDF page 15).

