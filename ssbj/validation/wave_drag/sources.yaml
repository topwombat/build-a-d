        - [3.00, 0.00305, 0.00378]
        - [3.10, 0.00294, 0.00369]
        - [3.20, 0.00289, 0.00357]
        - [3.30, 0.00287, 0.00340]
        - [3.40, 0.00288, 0.00330]
    unit: dimensionless, based on S = 800 in^2
    conditions: "zero lift; transition fixed (grit); R/ft ~2-4 million (fig. 11); M 1.55-2.35 Ames 9x7 ft, M 2.50-3.50 Ames 8x7 ft Unitary Plan; body base pressure set to p_inf"
    source:
      title: NASA TM X-372 (as above)
      report_number: NASA TM X-372
      url: "https://archive.org/download/NASA_NTRS_Archive_19980235518/NASA_NTRS_Archive_19980235518.pdf"
      page_figure_table: "fig. 13(d) p. 58 [pdf 60]; text p. 8-9 [pdf 10-11]"
    quote_or_transcription: >
      Digitized from fig. 13(d) (solid = Experiment, dashed = Theory). Text: "The experimental
      zero-lift wave-drag coefficients ... were determined from the basic data by removing the
      friction-drag coefficients. The friction-drag coefficients were assumed to be equal to the
      zero-lift drag coefficient at M = 0.60 and were adjusted at each Mach number to account for
      the variation with Mach number of the friction-drag coefficient for fully turbulent flow over
      a smooth surface." "The theoretical wave-drag coefficients were computed with the procedures
      of reference 4, and 49 harmonics were used to define the derivative of the model area
      distributions." "The experimental wave-drag coefficients shown for the arrow model in figure
      13(d) include the wing base-drag coefficient."
    source_quality: pdf_read
    retrieved: 2026-10-06
    notes: >
      digitized: page rendered at 400 dpi, rotated; vertical grid lines (0.1 M) and horizontal
      grid lines (0.002) located by pixel detection; scan skew corrected by a fitted zero line
      (2532 - 0.00965*(x-1000) px). Solid/dashed separated by line continuity. Read uncertainty
      ~ +/-0.0001. Where only one value is given for both (M 1.70-1.90) the two curves coincide
      within line width. The experimental curve is a faired line (no symbols); there is a data
      gap M 2.35-2.50 (two tunnels). Ref. 4 = Holdaway & Mersman, NACA RM A55J28 (Tchebichef
      harmonic analysis, supersonic area rule) - i.e. a far-field area-rule method comparable to
      Harris. Note the text's general statement: "the experimental wave-drag coefficients for the
      three plan forms investigated are lower than the theoretical wave-drag coefficients near
      sonic wing-edge conditions."

