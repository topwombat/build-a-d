# Geometry + measured zero-lift wave drag: NASA TM X-372 "arrow model"
# Holdaway, G. H. and Mellenthin, J. A.: Investigation at Mach Numbers of 0.20 to 3.50
# of Blended Wing-Body Combinations of Sonic Design with Diamond, Delta, and Arrow
# Plan Forms. NASA TM X-372, Ames Research Center, Aug. 1960 (declassified Sept. 1, 1961).
# PDF read: https://archive.org/download/NASA_NTRS_Archive_19980235518/NASA_NTRS_Archive_19980235518.pdf
#   (archive.org mirror of NTRS 19980235518; ntrs.nasa.gov returned HTTP 403 from this sandbox)
# retrieved: 2026-10-06
# Page numbers below are PRINTED page numbers ("p. 21") with the PDF page in brackets [pdf 23].
# All dimensions in inches (model scale). Model is symmetric about the wing plane
# (uncambered, untwisted; semithickness tabulated as +/- t/2).
#
# Transcription status flags:
#   ok        = clearly legible in scan
#   faint     = digit legible but faint; best reading given
#   uncertain = last digit not resolvable; alternatives in note
#   derived   = computed by me from tabulated/stated quantities (not printed in the report)

case_name: tmx372_arrow
description: >
  Ames blended wing-body "of sonic design" with an aspect-ratio-2 arrow wing
  (LE sweep 70.82 deg, TE sweep 41.19 deg, pointed tips), body of revolution of
  length 60 in, all models built to the same M=1.00 design area distribution.
  Wing has a blunt trailing edge (base) and a straight "ridge" (max-thickness line)
  at 83.3% local chord. Wind-tunnel model, sting mounted, transition fixed.

reference:
  S_ref_in2: 800.0          # "Sw = 800 sq in." fig. 1(d) p. 28 [pdf 30]; text p. 7: coefficients "based on the complete plan-form area of the wings of 800 square inches" (scan: "@00 square i...", value confirmed by fig. 1(d))
  aspect_ratio: 2           # fig. 1(d) "A = 2"
  semispan_in: 20.0         # fig. 1(d) "b/2 = 20"
  body_length_in: 60.0      # fig. 1(d) "l = 60"
  root_chord_in: 40.0       # fig. 1(d) "cR = 40"
  mac_in: 26.67             # fig. 1(d) "c-bar = 26.67"
  le_sweep_deg: 70.82       # fig. 1(d) and summary p. 1
  te_sweep_deg: 41.19       # fig. 1(d)
  moment_ref_station_in: 34.50
  source: "NASA TM X-372, fig. 1(d) p. 28 [pdf 30]"

planform:   # all derived from fig. 1(d) + Table IV, and checked against Table IV entries
  wing_apex_x_in: 0.0       # Table IV row x=0.000, y=0 semithickness 0.000; fig.1(d) "Sta. 0" at apex
  leading_edge: "x_le = 2.875*y  (tan 70.82 deg = 2.875; Table IV: y=2.000 starts at x=5.750, y=16.667 at x=47.918)"
  trailing_edge: "x_te = 40 + 0.875*y (tan 41.19 deg = 0.875; Table IV TE column: y=2.286 at x=42.000, y=20.000 at x=57.500)"
  ridge_line: "x_ridge = 33.333 + 1.2083*y  (Table IV ridge column: y=0 at x=33.333, y=20.000 at x=57.500) -> 83.3% local chord at every station"
  tip: "pointed, x=57.500, y=20.000 (Table IV last row)"
  status: derived

