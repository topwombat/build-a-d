  sting_note: >
    Body base r=1.625 in at x=60. "At all Mach numbers the drag coefficients were adjusted
    by setting the body base pressure equal to free-stream static pressure." (p. 7 [pdf 9]).
    For far-field wave drag, close the area distribution with a constant-area cylinder
    (sting) aft of x=60 - my assumption; TM X-372 does not state how the base was closed in
    its theory, only that "The variation of the body area distribution with Mach number,
    used in the theoretical computations, was based on method 1 described in reference 1"
    (p. 8 [pdf 10]; ref. 1 = NASA TM X-105).

fins: none (wing-body only; no tail, no nacelles)
nacelles: none

wing_body_junction_note: >
  The wing semithickness is tabulated to the centre line (y=0) even where it is buried in
  the body. The body radii are those of the body of revolution; the wing passes through it.
  For an area-rule code, either (a) input wing from y=0 and subtract nothing (code must
  handle overlap), or (b) start the exposed wing at the body surface. The report does
  not say how its theory handled the overlap; the design was done by "varying the
  section shape along with the body radii (blending process) to match the prescribed
  area distribution" (summary p. 1). Figure 3 (p. 32 [pdf 34]) gives the design total
  cross-sectional area distribution (normal areas, M=1) which can be used to check the
  reconstruction (not digitized here).

test_conditions:
  facility: "Ames 9- by 7-foot (M 1.55-2.35) and 8- by 7-foot (M 2.50-3.50) supersonic test sections of the Unitary Plan wind tunnel"
  reynolds: "about 4,000,000 to 9,000,000 based on MAC (summary); R/ft 2-4 million depending on M (test table p. 6 [pdf 8], fig. 11)"
  transition: "fixed; grit avg height ~0.040 in, 1.13 in rearward of wing LE (upper and lower) and of body nose (p. 7 [pdf 9]); laminar area ~5% of wing area"
  grit_penalty: "Appendix B (delta model, M=3.00): grit penalty in CDo of 0.0003 separate from the effect of fixing transition; data NOT corrected for it (p. 8 [pdf 10])"
  base_pressure: "body base pressure set to free-stream static; WING base drag of the arrow model is NOT removed"

measured_wave_drag:
  # Figure 13(d), p. 58 [pdf 60]: "Zero-lift wave-drag coefficients of the various models
  # as determined by experiment and theory. (d) Arrow model."
  # Digitized by me from a 400-dpi render of the scan: grid lines located by pixel
  # detection (0.1 in M, 0.002 in dCDo); scan skew (~0.55 deg) corrected with fitted
  # zero line. Estimated read uncertainty +/-0.0001 (curve-line width ~0.00005).
  # Solid = experiment (faired curve, no data symbols shown), dashed = theory.
  # Experiment = CDo(total, body base at p_inf) - friction estimate; INCLUDES wing base drag.
  definition_quote: >
    "The experimental zero-lift wave-drag coefficients (fig. 12(b)) were determined from
    the basic data by removing the friction-drag coefficients. The friction-drag
    coefficients were assumed to be equal to the zero-lift drag coefficient at M = 0.60
    and were adjusted at each Mach number to account for the variation with Mach number
    of the friction-drag coefficient for fully turbulent flow over a smooth surface. ...
    The friction-drag coefficients used to determine the wave-drag coefficients were also
    corrected for variations in Reynolds number." (p. 8-9 [pdf 10-11])
  theory_quote: >
    "The theoretical wave-drag coefficients were computed with the procedures of
    reference 4, and 49 harmonics were used to define the derivative of the model area
    distributions." (p. 8 [pdf 10]); ref. 4 = Holdaway & Mersman, NACA RM A55J28 (Tchebichef
    harmonic analysis applied to the supersonic area rule).
  base_quote: >
    "The experimental wave-drag coefficients shown for the arrow model in figure 13(d)
    include the wing base-drag coefficient. The agreement between theory and experiment
    shown at the intermediate supersonic Mach numbers would be poorer if the variation
    with Mach number of wing base drag were introduced." (p. 9 [pdf 11])
  units: "dimensionless, based on S = 800 in^2"
