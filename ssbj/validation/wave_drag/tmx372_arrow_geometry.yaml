trailing_edge_text_quote: >
    "Note that the rear portion of the arrow wing was designed with a blunt trailing
    edge, as suggested in reference 2, to avoid wing sections with large rearward slopes.
    For wing sections perpendicular to the body center line, ... the trailing-edge
    thicknesses of the arrow wing were half the ridge thicknesses, except near the body
    juncture, as shown in table IV." (p. 5 [pdf 8])

