- engine: CFM LEAP (as SST core, analyst estimate)
  core_family: CFM56 / GE F101 '1/9' core (9-stage HPC, 1-stage HPT)
  quantity: compressor exit temperature
  value: ~650
  unit: degC
  conditions: LEAP flown at M1.4, 45,000 ft (compressor inlet +28 degC)
  source:
    title: Leeham News, 'The Supersonic dilemma' (B. Fehrm), 20 Dec 2017
    url: https://leehamnews.com/2017/12/20/the-supersonic-dilemma/
    page_or_section: body
  quote: If we fly the LEAP at the Aerion data, M1.4 and 45kft, the air entering the compressor is at +28°C, a 56°C rise. Now the end of the compressor is around 650°C. This is uncomfortably high for a
    three-hour cruise and the cooling air for the turbines and combustor is a bit hot.
  source_quality: page_read
  retrieved: '2026-10-06'
  notes: 'Analyst estimate; same article gives ~520 degC at M0.78/35,000 ft for LEAP. Cross-listed: relevant to eCore family.'
